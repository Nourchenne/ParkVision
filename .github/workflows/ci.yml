name: Python CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install mlflow==3.17.2 python-dotenv==1.0.1 PyYAML==6.0.3 pytest==9.2.0 ruff==0.17.3
      - name: Check Python syntax
        run: python -m compileall -q src tests
      - name: Lint quality gate, registry, importer, and tests
        run: ruff check src/analysis/analyze_errors.py src/analysis/validate_model.py src/models/registry.py src/models/registry_policy.py src/models/registry_adapter.py src/models/registry_lock.py src/utils/transfer_run.py tests/test_error_analysis.py tests/test_validate_model.py tests/test_registry.py tests/test_training_tools.py tests/test_transfer_run.py tests/test_registry_env.py
      - name: Validate quality configuration schema
        run: python src/analysis/validate_model.py --check-config --config configs/model_quality.yaml
      - name: Run local and mocked tests
        run: python -m pytest tests/ -q
      - name: Check whitespace
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE=$(git merge-base "$BASE_SHA" HEAD)
            git diff --check "$BASE" HEAD --
          elif [ -n "$BEFORE_SHA" ] &&
              [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] &&
              git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BEFORE_SHA" HEAD --
          else
            git diff --check HEAD --
          fi
