name: Python CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install mlflow==3.17.2 python-dotenv==1.2.2 PyYAML==6.0.3 pytest==9.2.0 pytest-cov==7.0.0 ruff==0.17.3 mypy==2.3.1 fastapi==0.115.12 uvicorn==0.34.2 wsproto==1.2.0 python-multipart==0.0.20 pillow==11.2.1 httpx==0.28.1 opencv-python==5.0.0.93 yt-dlp==2026.10.21
      - name: Check Python syntax
        run: python -m compileall -q src tests
      - name: Lint quality gate, registry, importer, and tests
        run: ruff check --target-version py310 src/api src/analysis/analyze_errors.py src/analysis/validate_model.py src/analysis/validation_contract.py src/analysis/monitor_report.py src/models/registry.py src/models/registry_policy.py src/models/registry_adapter.py src/models/registry_lock.py src/models/export_onnx.py src/utils/transfer_run.py tests/
      - name: Type-check quality gate, registry, importer, and API
        run: python -m mypy --ignore-missing-imports --explicit-package-bases src/api src/analysis/analyze_errors.py src/analysis/validate_model.py src/analysis/validation_contract.py src/analysis/monitor_report.py src/models/registry.py src/models/registry_policy.py src/models/registry_adapter.py src/models/registry_lock.py src/models/export_onnx.py src/utils/transfer_run.py
      - name: Validate quality configuration schema
        run: python src/analysis/validate_model.py --check-config --config configs/model_quality.yaml
      - name: Run local and mocked tests with coverage
        run: python -m pytest tests/ -q --cov=src --cov=orchestration --cov-report=term-missing:skip-covered --cov-report=xml
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
      - name: Check whitespace
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE=$(git merge-base "$BASE_SHA" HEAD)
            git diff --check "$BASE" HEAD --
          elif [ -n "$BEFORE_SHA" ] &&
              [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] &&
              git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BEFORE_SHA" HEAD --
          else
            git diff --check HEAD --
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run tests
        run: npm run test
      - name: Build
        run: npm run build

  docker-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t parkvision-backend:ci -f Dockerfile.backend .
      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: parkvision-backend:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0