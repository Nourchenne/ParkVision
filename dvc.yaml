stages:
  prepare_split:
    cmd: python src/data/prepare_split.py
    deps:
    - data/raw
    - src/data/prepare_split.py
    outs:
    - data/processed/split_manifest.csv
  prepare_yolo:
    cmd: python src/data/prepare_yolo.py
    deps:
    - data/processed/split_manifest.csv
    - data/raw
    - src/data/prepare_yolo.py
    outs:
    - data/processed/yolo
